<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>benchy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Both attributes must land before the first paint, or every reload
         flashes the default dark-purple chrome. A raw script can't import, so
         the accent whitelist is duplicated here; tokens.accent.test.ts checks
         it against tokens.css and theme.ts. -->
    <script>
      (function () {
        var saved = localStorage.getItem('benchy-theme') || 'dark';
        var resolved = saved === 'system'
          ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          : saved;
        document.documentElement.setAttribute('data-theme', resolved);

        var accent = localStorage.getItem('benchy-accent');
        var known = ['purple', 'blue', 'teal', 'rose'];
        document.documentElement.setAttribute(
          'data-accent',
          known.indexOf(accent) === -1 ? 'purple' : accent
        );
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-BMKDz0qL.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CkAkBLjh.css">
  </head>

  </body>
</html>
